[project]
name = "gerenciador-de-compras"
version = "0.1.0"
description = "Autogerenciamento das compras de mercado a partir de fotos de NFC-e"
requires-python = ">=3.10"
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13",
  "pillow>=10",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.50"]
lmstudio = ["openai>=1.50"]
todos = ["anthropic>=0.40", "google-genai>=1.0", "openai>=1.50"]
sefaz = ["playwright>=1.40", "beautifulsoup4>=4.12", "opencv-python-headless>=4.8"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9",
       "beautifulsoup4>=4.12"]
ia = ["langgraph>=1.0", "langchain-openai>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
compras = "compras.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["src"]
